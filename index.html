<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strata — Student Time Management Advisor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%2230%22 fill=%22%235B9BE0%22 y=%2210%22 rx=%225%22/><rect width=%22100%22 height=%2230%22 fill=%22%2386ABB9%22 y=%2245%22 rx=%225%22/><rect width=%22100%22 height=%2230%22 fill=%22%23A9C4CB%22 y=%2280%22 rx=%225%22/></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
</head>
<body>
    <!-- Background Decorative Blobs for Glassmorphism -->
    <div class="bg-blobs" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Auth Gate View -->
    <div id="auth-view" class="auth-view">
        <div class="auth-card">
            <!-- Logo Header -->
            <div class="auth-logo-group">
                <svg class="logo-icon-large" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6" stroke="#5B9BE0" stroke-width="3.5" />
                    <line x1="4" y1="12" x2="20" y2="12" stroke="#86ABB9" stroke-width="3.5" />
                    <line x1="4" y1="18" x2="20" y2="18" stroke="#A9C4CB" stroke-width="3.5" />
                </svg>
                <h1 class="auth-logo-text">STRATA</h1>
            </div>
            <p class="auth-tagline">STUDENT TIME MANAGEMENT ADVISOR</p>

            <!-- Toggle tabs -->
            <div class="auth-toggle">
                <button id="toggle-login-tab" class="auth-tab active">Log In</button>
                <button id="toggle-signup-tab" class="auth-tab">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-id" class="form-label">Student ID or Email</label>
                    <input type="text" id="login-id" class="form-input" placeholder="e.g. alex@univ.edu" required>
                    <div class="error-message" id="login-id-error"></div>
                </div>
                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                    <div class="error-message" id="login-password-error"></div>
                </div>
                <button type="submit" class="submit-btn full-width">
                    <span>Log In</span>
                </button>
                <p class="auth-switch-text">New here? <a href="#" id="link-to-signup">Sign up</a></p>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input type="text" id="signup-name" class="form-input" placeholder="e.g. Alex Chen" required>
                    <div class="error-message" id="signup-name-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-id" class="form-label">Student ID or Email</label>
                    <input type="text" id="signup-id" class="form-input" placeholder="e.g. alex@univ.edu" required>
                    <div class="error-message" id="signup-id-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-password" class="form-label">Password</label>
                    <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" required>
                    <div class="error-message" id="signup-password-error"></div>
                </div>
                <div class="form-group">
                    <label for="signup-confirm" class="form-label">Confirm Password</label>
                    <input type="password" id="signup-confirm" class="form-input" placeholder="••••••••" required>
                    <div class="error-message" id="signup-confirm-error"></div>
                </div>
                <button type="submit" class="submit-btn full-width">
                    <span>Create Account</span>
                </button>
                <p class="auth-switch-text">Already have an account? <a href="#" id="link-to-login">Log in</a></p>
            </form>
        </div>
    </div>

    <!-- Toast container inside body -->
    <div id="toast-container" class="toast-container"></div>

    <script src="auth.js"></script>
</body>
</html>
